  <style>
    :root {
      --bg: #030712;
      --glass-surface: rgba(17, 24, 39, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-specular: inset 0 1px 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4);
      --accent-cyan: #00f0ff;
      --accent-cyan-glow: rgba(0, 240, 255, 0.35);
      --accent-gold: #fbbf24;
      --emerald: #10b981;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --glass-blur: blur(28px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Glossy Light Orbs */
    .gloss-orb-1 {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(59, 130, 246, 0.06) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .gloss-orb-2 {
      position: fixed;
      bottom: 10%;
      right: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: max(32px, env(safe-area-inset-top)) 16px 80px 16px;
    }

    /* Glossy Header */
    .brand-hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .emblem-stage {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px auto;
      position: relative;
    }

    .emblem-disc {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(15, 23, 42, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), var(--glass-specular);
      backdrop-filter: var(--glass-blur);
    }

    .emblem-disc svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 0 12px var(--accent-cyan-glow));
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subline {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--emerald);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* Glossy Category Tabs */
    .filter-viewport {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .filter-viewport::-webkit-scrollbar { display: none; }

    .gloss-tab {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-specular);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .gloss-tab:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .gloss-tab.active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.06) 100%), rgba(0, 240, 255, 0.14);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 20px var(--accent-cyan-glow), var(--glass-specular);
    }

    /* Glossy Search Bar */
    .search-wrapper {
      position: relative;
      margin-bottom: 18px;
      width: 100%;
    }

    .gloss-search {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.015) 100%), var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), var(--glass-specular);
      backdrop-filter: var(--glass-blur);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .gloss-search:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 24px var(--accent-cyan-glow), var(--glass-specular);
    }

    .search-icon-svg {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-tertiary);
      pointer-events: none;
    }
  </style>
</head>
  <style>
    /* Glossy Channel Cards Deck */
    .deck-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;

    .channel-card {

    .card-leading {

      align-items: center;
      gap: 13px;
      flex: 1;
      min-width: 0;

      box-shadow: var(--glass-specular);

      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .card-icon-box svg {
      width: 20px;
      height: 20px;
    }

    .card-text {
      min-width: 0;
      flex: 1;
    }

    .channel-heading {
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;

      cursor: pointer;
      font-size: 0.86rem;

    let CHANNELS = [
      { slot: "c1", icon: "shield", name: "MAIN BACKUP CHANNEL", badge: "OFFICIAL", cat: "vip", members: "128k Subscribers", link: "https://t.me/+hNw6_W8feAtkNmRl", featured: true },
      { slot: "c2", icon: "news", name: "VIRAL NEWS 📰", badge: "NEWS", cat: "news", members: "84k Subscribers", link: "https://t.me/+ScPaYNrWjB03YTM1" },
      { slot: "c3", icon: "archive", name: "CREATOR ARCHIVES 🎬", badge: "ARCHIVE", cat: "archives", members: "95k Subscribers", link: "https://t.me/+vg4oqSxq98o5MGM9" },
      { slot: "c4", icon: "fire", name: "TRENDING REELS 🔥", badge: "TRENDING", cat: "trending", members: "112k Subscribers", link: "https://t.me/+4kudDX0k4B8wNjZl" },
      { slot: "c5", icon: "bolt", name: "PULSE MEDIA ⚡", badge: "POPULAR", cat: "trending", members: "64k Subscribers", link: "https://t.me/+TQ-Sj55nFEcwMGZl" },
      { slot: "c6", icon: "diamond", name: "EXCLUSIVE MEDIA 💎", badge: "EXCLUSIVE", cat: "vip", members: "77k Subscribers", link: "https://t.me/+ndnyWnLhQ_ExNTg1" },
      { slot: "c7", icon: "crown", name: "VIP LOUNGE 👑", badge: "VIP PASS", cat: "vip", members: "53k Subscribers", link: "https://t.me/+NynlcDlrCBFjNzNl" },
      { slot: "c8", icon: "vault", name: "COLLECTIVE VAULT 🎥", badge: "VAULT", cat: "archives", members: "68k Subscribers", link: "https://t.me/+jYbJTa9ve0E2ODI9" },
      { slot: "c9", icon: "star", name: "PRIME SPOTLIGHT 🌟", badge: "HOT DROP", cat: "trending", members: "49k Subscribers", link: "https://t.me/+og-f0V4X9_E5MDdl" }
    ];

    let currentCategory = 'all';
    const container = document.getElementById('channel-deck');

    function renderCards() {
      container.innerHTML = '';
      const query = document.getElementById('channel-search').value.toLowerCase();

      const filtered = CHANNELS.filter(item => {
        const matchesCategory = (currentCategory === 'all' || item.cat === currentCategory);
        const matchesSearch = (!query || item.name.toLowerCase().includes(query) || item.badge.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });

      filtered.forEach((item) => {
        const card = document.createElement('article');
        card.className = `channel-card ${item.featured ? 'featured-card' : ''}`;

        card.innerHTML = `
          <div class="card-leading">
            <div class="card-icon-box">${SVG_ICONS[item.icon] || SVG_ICONS.star}</div>
            <div class="card-text">
              <h3 class="channel-heading">${item.name}</h3>
              <div class="channel-metadata">
                <span class="meta-tag">${item.badge}</span>
                <span class="meta-dot">•</span>
                <span>${item.members}</span>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-copy-link" title="Copy Link" aria-label="Copy Link">${SVG_ICONS.copy}</button>
            <div class="btn-join-pill">
              <span>Join</span>
              ${SVG_ICONS.arrowRight}
            </div>
          </div>
        `;

        // Direct Link Copy
        const copyBtn = card.querySelector('.btn-copy-link');
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(item.link);
          copyBtn.style.borderColor = "var(--accent-cyan)";
          setTimeout(() => { copyBtn.style.borderColor = ""; }, 1200);
        });

        // Launch Link
        card.addEventListener('click', () => {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
          }

          let targetUrl = item.link;
          if (item.link_b && Math.random() < 0.5) targetUrl = item.link_b;

          const urlParams = new URLSearchParams(window.location.search);
          const src = urlParams.get('src') || (window.Telegram && window.Telegram.WebApp ? 'tma' : 'direct');
          fetch(`${GATEWAY}/api/click?slot=${item.slot}&src=${src}`, { method: 'POST', mode: 'no-cors' });

          const cleanInvite = targetUrl.replace('https://t.me/+', '');
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.openTelegramLink(targetUrl);
          } else {
            window.location.href = `tg://join?invite=${cleanInvite}`;
            setTimeout(() => { window.location.href = targetUrl; }, 400);
          }
        });

        container.appendChild(card);
      });

      // GSAP Stagger Reveal
      if (typeof gsap !== "undefined") {
        gsap.fromTo(".channel-card", 
          { opacity: 0, y: 12 }, 
          { opacity: 1, y: 0, duration: 0.35, stagger: 0.03, ease: "power2.out" }
        );
      }
    }

    // Category Tabs Logic
    document.querySelectorAll('.gloss-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.gloss-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.getAttribute('data-category');
        renderCards();
      });
    });

    document.getElementById('channel-search').addEventListener('input', renderCards);

    // Modal Support
    const modal = document.getElementById('modal-container');
    const openModal = (title) => {
      document.getElementById('modal-heading').textContent = title;
      modal.style.display = 'flex';
    };

    document.getElementById('btn-dmca').addEventListener('click', () => openModal("Compliance Notice"));
    document.getElementById('btn-report').addEventListener('click', () => openModal("Report Inactive Link"));
    document.getElementById('btn-support').addEventListener('click', () => openModal("Support Desk"));
    document.getElementById('btn-close-modal').addEventListener('click', () => modal.style.display = 'none');

    document.getElementById('btn-submit-ticket').addEventListener('click', async () => {
      const topic = document.getElementById('ticket-topic').value;
      const details = document.getElementById('ticket-details').value;
      if (!topic && !details) return alert("Please provide details.");

      try {
        await fetch(`${GATEWAY}/notify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: `User Dispatch:\nTopic: ${topic}\nDetails: ${details}` })
        });
        alert("Dispatch delivered to Sentinel Desk.");
        modal.style.display = 'none';
        document.getElementById('ticket-topic').value = '';
        document.getElementById('ticket-details').value = '';
      } catch (err) {
        alert("Dispatch logged.");
        modal.style.display = 'none';
      }
    });

    // Remote Schema Synchronization
    async function syncRemoteConfig() {
      try {
        const res = await fetch(`${GATEWAY}/api/config`);
        if (!res.ok) return;
        const config = await res.json();

        if (config.schema && Array.isArray(config.schema) && config.schema.length > 0) {
          CHANNELS = config.schema.map((item, idx) => ({
            ...item,
            icon: CHANNELS[idx] ? CHANNELS[idx].icon : "star",
            cat: CHANNELS[idx] ? CHANNELS[idx].cat : "trending",
            members: CHANNELS[idx] ? CHANNELS[idx].members : "Active"
          }));
          renderCards();
        }
      } catch (e) {
        console.warn("Using edge cache schema");
      }
    }

    renderCards();
    syncRemoteConfig();
  </script>
</body>
</html>
