<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JoinLinks Official Hub | Premium Direct Directory</title>

  <meta property="og:title" content="JoinLinks Official Hub — Direct Channel Portal">
  <meta property="og:description" content="Access verified exclusive channels, breaking archives, and VIP vaults in one tap.">
  <meta property="og:image" content="https://media.canva.com/v2/image-resize/format:PNG/height:675/quality:100/uri:ifs%3A%2F%2FM%2Fd9d3e419-e1d2-4a0c-9053-383f9b70af8c/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAANLO1GUNRrBkI4kga0pI3pPaI3ZR9FToMwFq7ONgxfs7&exp=1790245532&osig=AAAAAAAAAAAAAAAAAAAAAGwq266VVVz0r9Qbc_qHKG40paTsEZa6TP6Mvw4MMnsP&signer=media-rpc&x-canva-quality=thumbnail">
  <meta property="og:url" content="https://joinlinks.pages.dev/">
  <meta name="twitter:card" content="summary_large_image">
  
  <!-- Favicon / PWA Manifest -->
  <link rel="icon" type="image/png" href="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fac993e2a-7ab6-46e2-a3c6-4e1533aa733c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMlDvGLn_hKaM0d7fVvVTMW_tnQGEuBgYeIBFMy2IEw-&exp=1790244419&osig=AAAAAAAAAAAAAAAAAAAAALU7wvbO4_HhIf_DatZuA0WFiy3A1IP9G8b0ocV3mXd4&signer=media-rpc&x-canva-quality=thumbnail">
  <link rel="manifest" href="https://joinlinks-edge-gateway.prabhu-y1211.workers.dev/manifest.webmanifest">
  <meta name="theme-color" content="#030712">

  <!-- Fonts & Confetti Engine -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #050814;
      --card-bg: rgba(13, 20, 38, 0.75);
      --card-border: rgba(0, 240, 255, 0.16);
      --card-hover-border: rgba(0, 240, 255, 0.55);
      --cyan: #00f0ff;
      --gold: #ffd700;
      --emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-blur: blur(14px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Dynamic Particle Canvas */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Main Container with Safe-Area Top Spacing */
    .app-wrapper {
      position: relative;
      z-index: 10;
      max-width: 580px;
      margin: 0 auto;
      padding-top: max(45px, env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 110px;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 12px auto;
      display: block;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      object-fit: cover;
      animation: avatarGlow 3.5s infinite ease-in-out;
    }

    @keyframes avatarGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        border-color: rgba(0, 240, 255, 0.7);
      }
      50% {
        box-shadow: 0 0 35px rgba(0, 240, 255, 0.7), 0 0 14px rgba(255, 215, 0, 0.35);
        border-color: var(--cyan);
      }
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.35;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 40%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--emerald);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--emerald);
      animation: ripple 1.6s infinite;
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(3.5); opacity: 0; }
    }

    /* Fixed Height Marquee with Mask */
    .marquee-container {
      display: flex;
      align-items: center;
      height: 40px;
      line-height: 40px;
      background: rgba(13, 20, 38, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-radius: 10px;
      padding: 0 14px;
      margin-bottom: 20px;
      overflow: hidden;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    .marquee-text {
      display: inline-block;
      line-height: 40px;
      animation: marquee 22s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Live Search Bar */
    .search-bar {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(13, 20, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 20px;
      outline: none;
      backdrop-filter: var(--glass-blur);
      transition: all 0.25s ease;
    }

    .search-bar:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
    }

    /* Channel Cards Deck */
    .channels-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .channel-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: var(--glass-blur);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), border-color 0.2s, box-shadow 0.2s;
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .channel-card:active {
      transform: scale(0.98);
    }

    /* Neon Sheen Border for Featured C1 */
    .card-featured {
      border: 1px solid transparent;
      background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                  linear-gradient(90deg, var(--cyan), #3b82f6, var(--gold)) border-box;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.18);
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-slot-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.12);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-text h3 {
      font-size: 0.98rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .activity-tag {
      font-size: 0.72rem;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0.85;
    }

    /* High-Impact JOIN Buttons */
    .join-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      padding: 9px 18px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
      pointer-events: none;
    }

    .card-featured .join-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%);
      color: #030712;
      border: none;
      font-weight: 800;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.45);
    }

    .channel-card:hover .join-btn {
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
      transform: translateX(2px);
    }

    /* VIP Gamified Locked Card */
    .card-locked {
      background: rgba(20, 15, 35, 0.85);
      border-color: rgba(255, 215, 0, 0.28);
    }

    .progress-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 999px;
      pointer-events: none;
    }

    /* Floating Mystery FAB */
    .mystery-fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 100;
      background: linear-gradient(135deg, #7928ca, #ff0080);
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(255, 0, 128, 0.4);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mystery-fab:hover {
      transform: scale(1.06);
    }

    /* Tap Ripple Flare */
    .ripple-flare {
      position: absolute;
      width: 15px;
      height: 15px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.85) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: explode 0.5s ease-out forwards;
    }

    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(32); opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="ambient-canvas"></canvas>

  <div class="app-wrapper">
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="avatar-wrapper">
        <img class="avatar-img" src="https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fac993e2a-7ab6-46e2-a3c6-4e1533aa733c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAMlDvGLn_hKaM0d7fVvVTMW_tnQGEuBgYeIBFMy2IEw-&exp=1790244419&osig=AAAAAAAAAAAAAAAAAAAAALU7wvbO4_HhIf_DatZuA0WFiy3A1IP9G8b0ocV3mXd4&signer=media-rpc&x-canva-quality=thumbnail" alt="JoinLinks Hub Logo">
      </div>
      <h1 class="brand-title">JOINLINKS HUB</h1>
      <div class="brand-badge">
        <span class="pulse-dot"></span> 99.9% VERIFIED NETWORK
      </div>
    </header>

    <!-- Ticker with Vertical Alignment and Edge Mask -->
    <div class="marquee-container">
      <span class="marquee-text" id="live-ticker">⚡ Real-time verified gateway | Tap to launch directly in Telegram | 18+ DMCA protected desk active</span>
    </div>

    <!-- Live Filter Search -->
    <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search channels, archives, categories...">

    <!-- Directory List -->
    <div class="channels-deck" id="channels-container"></div>
  </div>

  <!-- Gamified Mystery Action Button -->
  <button class="mystery-fab" id="mystery-btn">
    <span>🎲</span> MYSTERY CHANNEL
  </button>

  <script>
    // System Config & Gateways
    const GATEWAY = "https://joinlinks-edge-gateway.prabhu-y1211.workers.dev";
    const CHANNELS = [
      { slot: "c1", name: "MAIN BACKUP CHANNEL", badge: "OFFICIAL", meta: "⚡ 99.9% Online", link: "https://t.me/+hNw6_W8feAtkNmRl", featured: true },
      { slot: "c2", name: "VIRAL NEWS 📰", badge: "NEWS", meta: "🔥 Trending", link: "https://t.me/+ScPaYNrWjB03YTM1" },
      { slot: "c3", name: "CREATOR ARCHIVES 🎬", badge: "ARCHIVE", meta: "✨ Updated 5m ago", link: "https://t.me/+vg4oqSxq98o5MGM9" },
      { slot: "c4", name: "TRENDING REELS 🔥", badge: "TRENDING", meta: "⚡ Hot Drop", link: "https://t.me/+4kudDX0k4B8wNjZl" },
      { slot: "c5", name: "PULSE MEDIA ⚡", badge: "POPULAR", meta: "🔥 Active", link: "https://t.me/+TQ-Sj55nFEcwMGZl" },
      { slot: "c6", name: "EXCLUSIVE MEDIA 💎", badge: "EXCLUSIVE", meta: "👑 Verified", link: "https://t.me/+ndnyWnLhQ_ExNTg1" },
      { slot: "c7", name: "VIP LOUNGE 👑", badge: "VIP PASS", meta: "💎 Elite", link: "https://t.me/+NynlcDlrCBFjNzNl" },
      { slot: "c8", name: "COLLECTIVE VAULT 🎥", badge: "VAULT", meta: "🔒 Direct Pass", link: "https://t.me/+jYbJTa9ve0E2ODI9" },
      { slot: "c9", name: "PRIME SPOTLIGHT 🌟", badge: "HOT DROP", meta: "⭐ Recommended", link: "https://t.me/+og-f0V4X9_E5MDdl" },
      { slot: "c10", name: "SECRET VIP PORTAL", badge: "LOCKED VAULT", meta: "🔐 3 Joins Required", link: "https://t.me/+NynlcDlrCBFjNzNl", locked: true }
    ];

    let joinedSlots = JSON.parse(localStorage.getItem('jl_joined') || '[]');

    // Ambient Cyber Particle Canvas
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: Math.random() * 2 + 1
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 240, 255, 0.4)";
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // Render Cards Function
    const container = document.getElementById('channels-container');

    function render() {
      container.innerHTML = '';
      const filter = document.getElementById('search-input').value.toLowerCase();
      const isC10Unlocked = joinedSlots.length >= 3;

      CHANNELS.forEach(item => {
        if (filter && !item.name.toLowerCase().includes(filter) && !item.badge.toLowerCase().includes(filter)) {
          return;
        }

        const card = document.createElement('div');
        card.className = `channel-card ${item.featured ? 'card-featured' : ''} ${item.locked && !isC10Unlocked ? 'card-locked' : ''}`;
        
        let actionMarkup = `<div class="join-btn">JOIN <span>➔</span></div>`;
        if (item.locked && !isC10Unlocked) {
          actionMarkup = `<div class="progress-pill">${joinedSlots.length}/3 UNLOCKS</div>`;
        }

        card.innerHTML = `
          <div class="card-info">
            <span class="card-slot-badge">${item.slot.toUpperCase()}</span>
            <div class="card-text">
              <h3>${item.name}</h3>
              <div class="card-meta">
                <span style="font-size:0.75rem; color:var(--text-muted);">${item.badge}</span>
                <span class="activity-tag">• ${item.meta || 'Active'}</span>
              </div>
            </div>
          </div>
          ${actionMarkup}
        `;

        // Tap Haptics & Flare Animation
        card.addEventListener('pointerdown', (e) => {
          if (navigator.vibrate) navigator.vibrate(20);
          createFlare(e, card);
        });

        card.addEventListener('click', () => {
          if (item.locked && !isC10Unlocked) {
            alert(`🔒 Join at least 3 channels to unlock the Secret VIP Portal! (${joinedSlots.length}/3 joined)`);
            return;
          }

          if (!joinedSlots.includes(item.slot)) {
            joinedSlots.push(item.slot);
            localStorage.setItem('jl_joined', JSON.stringify(joinedSlots));
            if (joinedSlots.length === 3 && typeof confetti === 'function') {
              confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
          }

          // Background fire-and-forget telemetry
          fetch(`${GATEWAY}/api/click?slot=${item.slot}`, { method: 'POST', mode: 'no-cors' });

          // Direct deep-link intent launch
          const cleanInvite = item.link.replace('https://t.me/+', '');
          window.location.href = `tg://join?invite=${cleanInvite}`;
          setTimeout(() => { window.location.href = item.link; }, 400);
        });

        // 3D Card Perspective Tilt
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          card.style.transform = `perspective(1000px) rotateX(${-y * 0.04}deg) rotateY(${x * 0.04}deg) scale(1.01)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
        });

        container.appendChild(card);
      });
    }

    function createFlare(e, target) {
      const rect = target.getBoundingClientRect();
      const flare = document.createElement('div');
      flare.className = 'ripple-flare';
      flare.style.left = `${e.clientX - rect.left}px`;
      flare.style.top = `${e.clientY - rect.top}px`;
      target.appendChild(flare);
      setTimeout(() => flare.remove(), 500);
    }

    // Mystery Channel Roll
    document.getElementById('mystery-btn').addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      if (typeof confetti === 'function') {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      }
      const randomSlot = CHANNELS[Math.floor(Math.random() * (CHANNELS.length - 1))];
      setTimeout(() => {
        window.location.href = randomSlot.link;
      }, 500);
    });

    document.getElementById('search-input').addEventListener('input', render);
    render();
  </script>
</body>
</html>
