      } catch (err) {
        console.warn("Using edge cache", err);
      }
    }

    // Canvas Background
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: Math.random() * 2 + 1
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const style = getComputedStyle(document.body);
      const accent = style.getPropertyValue('--accent').trim() || '#00f0ff';
      ctx.fillStyle = accent;
      ctx.globalAlpha = 0.35;
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // Render Cards
    const container = document.getElementById('channels-container');

    function render() {
      container.innerHTML = '';
      const filter = document.getElementById('search-input').value.toLowerCase();
      const isC10Unlocked = joinedSlots.length >= 3;

      CHANNELS.forEach(item => {
        if (filter && !item.name.toLowerCase().includes(filter) && !item.badge.toLowerCase().includes(filter)) {
          return;
        }

        const card = document.createElement('div');
        card.className = `channel-card ${item.featured ? 'card-featured' : ''} ${item.locked && !isC10Unlocked ? 'card-locked' : ''}`;
        
        let actionMarkup = `<div class="join-btn">JOIN <span>➔</span></div>`;
        if (item.locked && !isC10Unlocked) {
          actionMarkup = `<div class="progress-pill">${joinedSlots.length}/3 UNLOCKS</div>`;
        }

        card.innerHTML = `
          <div class="card-info">
            <div class="card-slot-badge">${ICONS[item.icon] || item.slot.toUpperCase()}</div>
            <div class="card-text">
              <h3>${item.name}</h3>
              <div class="card-meta">
                <span style="font-size:0.75rem; color:var(--text-muted);">${item.badge}</span>
                <span class="activity-tag">• ${item.meta || 'Active'}</span>
              </div>
            </div>
          </div>
          ${actionMarkup}
        `;

        card.addEventListener('pointerdown', (e) => {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
          } else if (navigator.vibrate) {
            navigator.vibrate(20);
          }
          createFlare(e, card);
        });

        card.addEventListener('click', () => {
          if (item.locked && !isC10Unlocked) {
            alert(`🔒 Join at least 3 channels to unlock the Secret VIP Portal! (${joinedSlots.length}/3 joined)`);
            return;
          }

          if (!joinedSlots.includes(item.slot)) {
            joinedSlots.push(item.slot);
            localStorage.setItem('jl_joined', JSON.stringify(joinedSlots));
            if (joinedSlots.length === 3 && typeof confetti === 'function') {
              confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
          }

          // A/B Rotation Resolver: If slot has link_b, pick alternate
          let targetUrl = item.link;
          if (item.link_b) {
            const pickB = Math.random() < 0.5;
            targetUrl = pickB ? item.link_b : item.link;
          }

          // Telemetry with source and slot
          const urlParams = new URLSearchParams(window.location.search);
          const src = urlParams.get('src') || (window.Telegram && window.Telegram.WebApp ? 'tma' : 'direct');
          fetch(`${GATEWAY}/api/click?slot=${item.slot}&src=${src}`, { method: 'POST', mode: 'no-cors' });

          // Launch Telegram invite
          const cleanInvite = targetUrl.replace('https://t.me/+', '');
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.openTelegramLink(targetUrl);
          } else {
            window.location.href = `tg://join?invite=${cleanInvite}`;
            setTimeout(() => { window.location.href = targetUrl; }, 400);
          }
        });

        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          card.style.transform = `perspective(1000px) rotateX(${-y * 0.04}deg) rotateY(${x * 0.04}deg) scale(1.01)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
        });

        container.appendChild(card);
      });
    }

    function createFlare(e, target) {
      const rect = target.getBoundingClientRect();
      const flare = document.createElement('div');
      flare.className = 'ripple-flare';
      flare.style.left = `${e.clientX - rect.left}px`;
      flare.style.top = `${e.clientY - rect.top}px`;
      target.appendChild(flare);
      setTimeout(() => flare.remove(), 500);
    }

    document.getElementById('mystery-btn').addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
      if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      const randomSlot = CHANNELS[Math.floor(Math.random() * (CHANNELS.length - 1))];
      setTimeout(() => { window.location.href = randomSlot.link; }, 500);
    });

    document.getElementById('search-input').addEventListener('input', render);
    render();
    syncConfigWithEdge();
  </script>
</body>
</html>
