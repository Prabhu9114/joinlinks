      --card-border: rgba(255, 255, 255, 0.08);

      --neon-lime: #a3e635;

      --text-main: #ffffff;
      --text-muted: #8e9bb2;
      --text-dim: #556277;
      --glass-blur: blur(24px);

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;

    /* Ambient Background Gradients */
    .ambient-glow-top {
      position: fixed;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 420px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(163, 230, 53, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;

    .app-shell {

    .avatar-core {
      width: 100%;
      height: 100%;

      background: #0d121c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-core img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Kicker & Split-Color Typography */
    .kicker-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;

      align-items: center;
      justify-content: center;
      gap: 8px;

    .kicker-label span {
      color: var(--text-dim);

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand-title .accent-text {
      color: var(--neon-cyan);
      text-shadow: 0 0 24px var(--neon-cyan-glow);
    }

    .brand-caption {
      font-size: 0.86rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Dual Category Segment Pills */
    .category-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(14, 18, 28, 0.7);
      border: 1px solid var(--card-border);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      backdrop-filter: var(--glass-blur);
    }

    .tab-pill {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-field:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px var(--neon-cyan-glow);
    }

    .search-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: var(--text-dim);
      pointer-events: none;
    }

      const isSearchActive = query.length > 0;

      if (!isSearchActive) {
        displayList.push(FLAGSHIP_CHANNEL);
      }

      CHANNELS.forEach(item => {
        if (item.slot === FLAGSHIP_CHANNEL.slot && !isSearchActive) return;

        const matchesCategory = currentCategory === 'owner' ? item.isOwner : item.isPromo;
        const matchesQuery = !query || item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);

        if (matchesCategory && matchesQuery) {
          displayList.push(item);
        }
      });

      displayList.forEach(item => {
        const isFlagship = item.isFlagship === true;
        const card = document.createElement('article');
        card.className = `nitrox-card ${isFlagship ? 'flagship-gold' : ''}`;

        card.innerHTML = `
          <div class="card-left">
            ${getIconMarkup(item.iconType, isFlagship)}
            <div class="card-copy">
              <h3 class="card-title">${item.name}</h3>
              <p class="card-desc">${item.desc}</p>
            </div>
          </div>
          <div class="arrow-circle-btn" aria-label="Open Channel">
            ${SVG_ICONS.chevron}
          </div>
        `;

        card.addEventListener('click', () => {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
          }

          let targetUrl = item.link;
          const urlParams = new URLSearchParams(window.location.search);
          const src = urlParams.get('src') || (window.Telegram && window.Telegram.WebApp ? 'tma' : 'direct');
          
          fetch(`${GATEWAY}/api/click?slot=${item.slot}&src=${src}`, { 
            method: 'POST', 
            mode: 'cors',
            headers: { 'X-App-Request': '1' }
          }).catch(() => {});

          const cleanInvite = targetUrl.replace('https://t.me/+', '');
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.openTelegramLink(targetUrl);
          } else {
            window.location.href = `tg://join?invite=${cleanInvite}`;
            setTimeout(() => { window.location.href = targetUrl; }, 400);
          }
        });

        container.appendChild(card);
      });

      // Append fallback promotion slots if promo count < 2
      if (currentCategory === 'promo' && !isSearchActive) {
        const promoCount = displayList.filter(item => !item.isFlagship).length;
        if (promoCount < 2) {
          const slotsNeeded = 2 - promoCount;
          for (let i = 1; i <= slotsNeeded; i++) {
            const slotIndex = promoCount + i;
            const slotCard = document.createElement('a');
            slotCard.href = "https://t.me/JoinLinks_hub_bot?start=promo";
            slotCard.target = "_blank";
            slotCard.className = "slot-booking-card";

            slotCard.innerHTML = `
              <div class="card-left">
                <div class="color-icon-box gold">${SVG_ICONS.crown}</div>
                <div class="card-copy">
                  <h3>Promotional Slot #${slotIndex}</h3>
                  <p>Slot Available • Inquire & Book Placement</p>
                </div>
              </div>
              <div class="arrow-circle-btn">
                ${SVG_ICONS.chevron}
              </div>
            `;
            container.appendChild(slotCard);
          }
        }
      }

      // GSAP Stagger Reveal
      if (typeof gsap !== "undefined") {
        gsap.fromTo(".nitrox-card, .slot-booking-card", 
          { opacity: 0, y: 12 }, 
          { opacity: 1, y: 0, duration: 0.35, stagger: 0.035, ease: "power2.out" }
        );
      }
    }

    // Segment Tab Switching
    document.querySelectorAll('.tab-pill').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.getAttribute('data-category');
        renderCards();
      });
    });

    document.getElementById('channel-search').addEventListener('input', renderCards);

    // Support Modal Handlers
    const modal = document.getElementById('modal-container');
    const openModal = (title) => {
      document.getElementById('modal-heading').textContent = title;
      modal.style.display = 'flex';
    };

    document.getElementById('btn-dmca').addEventListener('click', () => openModal("Compliance Notice"));
    document.getElementById('btn-report').addEventListener('click', () => openModal("Report Inactive Link"));
    document.getElementById('btn-support').addEventListener('click', () => openModal("Support Desk"));
    document.getElementById('btn-close-modal').addEventListener('click', () => modal.style.display = 'none');

    document.getElementById('btn-submit-ticket').addEventListener('click', async () => {
      const topic = document.getElementById('ticket-topic').value;
      const details = document.getElementById('ticket-details').value;
      if (!topic && !details) return alert("Please provide details.");

      try {
        const res = await fetch(`${GATEWAY}/notify`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-App-Request': '1'
          },
          body: JSON.stringify({ text: `User Dispatch:\nTopic: ${topic}\nDetails: ${details}` })
        });
        
        if (res.status === 429) {
          alert("Rate limit exceeded. Please wait 10 minutes.");
        } else {
          alert("Dispatch delivered to Sentinel Desk.");
        }
        
        modal.style.display = 'none';
        document.getElementById('ticket-topic').value = '';
        document.getElementById('ticket-details').value = '';
      } catch (err) {
        alert("Dispatch logged.");
        modal.style.display = 'none';
      }
    });

    // Remote Schema Synchronization
    async function syncRemoteConfig() {
      try {
        const res = await fetch(`${GATEWAY}/api/config`);
        if (!res.ok) return;
        const config = await res.json();

        if (config.schema && Array.isArray(config.schema) && config.schema.length > 0) {
          CHANNELS = config.schema.map((item, idx) => {
            const isFlagship = item.slot === "c1";
            const isSponsor = item.badge && item.badge.toLowerCase().includes("sponsored");
            return {
              ...item,
              name: isFlagship ? "🄸🄽🅂🅃🄰 🅅🄸🅁🄰🄻" : item.name,
              desc: isFlagship ? "⚡ Daily Alerts • Exclusive Drops & Fresh Content 🔥" : (item.badge || "Verified Channel"),
              iconType: CHANNELS[idx] ? CHANNELS[idx].iconType : "telegram",
              isOwner: isFlagship || !isSponsor,
              isPromo: isFlagship || isSponsor,
              isFlagship: isFlagship
            };
          });
          renderCards();
        }
      } catch (e) {
        console.warn("Using edge cache schema");
      }
    }

    renderCards();
    syncRemoteConfig();
  </script>
</body>
</html>
