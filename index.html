<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JoinLinks Directory | Curated Telegram Index</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <meta property="og:title" content="JoinLinks Directory — Verified Channel Index">
  <meta property="og:description" content="Access vetted community channels, curated archives, and official hubs.">
  <meta property="og:url" content="https://joinlinks.pages.dev/">
  <meta name="twitter:card" content="summary_large_image">
  
  <link rel="manifest" href="https://joinlinks-edge-gateway.prabhu-y1211.workers.dev/manifest.webmanifest">
  <meta name="theme-color" content="#07090e">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Animation Engines: Lenis (Smooth Scroll) & GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    :root {
      --bg-base: #07090e;
      --surface-card: rgba(14, 18, 27, 0.72);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.22);
      --accent-gold: #e2b874;
      --accent-gold-glow: rgba(226, 184, 116, 0.25);
      --text-primary: #f8fafc;
      --text-secondary: #8e9bb0;
      --text-tertiary: #525d70;
      --glass-blur: blur(20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html.lenis {
      height: auto;
    }

    .lenis.lenis-smooth {
      scroll-behavior: auto;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      letter-spacing: -0.01em;
    }

    /* Ambient Depth Glow */
    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(226, 184, 116, 0.04) 0%, transparent 70%);
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Interactive Desktop Pointer */
    #cursor-follower {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background-color: var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  background-color 0.3s ease, 
                  border 0.3s ease;
    }

    #cursor-follower.cursor-hover {
      width: 48px;
      height: 48px;
      background-color: rgba(226, 184, 116, 0.08);
      border: 1px solid var(--accent-gold);
      backdrop-filter: blur(2px);
    }

    @media (pointer: coarse) {
      #cursor-follower { display: none !important; }
    }

    .app-shell {
      position: relative;
      z-index: 10;
      max-width: 580px;
      margin: 0 auto;
      padding: max(45px, env(safe-area-inset-top)) 18px 80px 18px;
    }

    /* Header & 3D Scroll Emblem */
    .brand-hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .emblem-stage {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px auto;
      position: relative;
      perspective: 1000px;
    }

    .emblem-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: radial-gradient(circle at 35% 35%, rgba(26, 32, 44, 0.8), rgba(9, 12, 18, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      will-change: transform;
    }

    .emblem-disc svg {
      width: 36px;
      height: 36px;
      stroke: var(--accent-gold);
      stroke-width: 1.5;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-subline {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-gold);
      background: rgba(226, 184, 116, 0.08);
      border: 1px solid rgba(226, 184, 116, 0.2);
      padding: 2px 10px;
      border-radius: 999px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-gold);
    }

    /* Editorial Category Tabs */
    .filter-viewport {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .filter-viewport::-webkit-scrollbar { display: none; }

    .editorial-tab {
      background: rgba(14, 18, 27, 0.6);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: var(--glass-blur);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .editorial-tab:hover {
      color: #fff;
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .editorial-tab.active {
      background: rgba(226, 184, 116, 0.12);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-gold-glow);
    }

    /* Minimalist Search */
    .search-wrapper {
      position: relative;
      margin-bottom: 22px;
    }

    .editorial-search {
      width: 100%;
      padding: 13px 18px 13px 44px;
      border-radius: 14px;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      backdrop-filter: var(--glass-blur);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .editorial-search:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 25px var(--accent-gold-glow);
    }

    .search-icon-svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: var(--text-tertiary);
      pointer-events: none;
    }

    /* Channel Cards Deck */
    .deck-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .channel-card {
      position: relative;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: var(--glass-blur);
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      will-change: transform, opacity;
    }

    .channel-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .channel-card.featured-pick {
      border: 1px solid rgba(226, 184, 116, 0.35);
      background: linear-gradient(145deg, rgba(22, 26, 38, 0.8), rgba(12, 15, 23, 0.9));
      box-shadow: 0 8px 32px rgba(226, 184, 116, 0.08);
    }

    .channel-card.featured-pick:hover {
      border-color: var(--accent-gold);
      box-shadow: 0 12px 36px var(--accent-gold-glow);
    }

    .card-main {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .card-symbol {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .channel-card:hover .card-symbol {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      transform: scale(1.05);
    }

    .card-symbol svg {
      width: 20px;
      height: 20px;
    }

    .card-details {
      min-width: 0;
      flex: 1;
    }

    .card-details h3 {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .card-metadata {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 0.73rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .editorial-badge {
      font-size: 0.68rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-divider {
      color: var(--border-subtle);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action-copy {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action-copy:hover {
      border-color: #fff;
      color: #fff;
    }

    .btn-action-copy svg {
      width: 15px;
      height: 15px;
    }

    .btn-action-launch {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-weight: 600;
      font-size: 0.78rem;
      padding: 9px 15px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .channel-card:hover .btn-action-launch {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #07090e;
      box-shadow: 0 0 16px var(--accent-gold-glow);
    }

    .btn-action-launch svg {
      width: 13px;
      height: 13px;
      transition: transform 0.2s ease;
    }

    .channel-card:hover .btn-action-launch svg {
      transform: translateX(3px);
    }

    /* Curator Sponsorship Section */
    .curator-slot {
      margin-top: 24px;
      background: linear-gradient(145deg, rgba(16, 21, 32, 0.8), rgba(9, 12, 18, 0.9));
      border: 1px dashed rgba(226, 184, 116, 0.3);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      backdrop-filter: var(--glass-blur);
    }

    .curator-info h4 {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--accent-gold);
    }

    .curator-info p {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .btn-curator {
      background: var(--accent-gold);
      color: #07090e;
      border: none;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 4px 18px var(--accent-gold-glow);
      transition: all 0.2s ease;
    }

    .btn-curator:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(226, 184, 116, 0.4);
    }

    /* Editorial Footer */
    .editorial-footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-tertiary);
      border-top: 1px solid var(--border-subtle);
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .legal-nav {
      display: flex;
      gap: 16px;
    }

    .legal-nav button {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.74rem;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }

    .legal-nav button:hover {
      color: var(--accent-gold);
    }

    /* Modal System */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.8);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-pane {
      background: #0d111a;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-top h3 {
      font-size: 1.05rem;
      color: #fff;
    }

    .btn-modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .editorial-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 0.86rem;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }

    .editorial-input:focus {
      border-color: var(--accent-gold);
    }

    .btn-submit-modal {
      width: 100%;
      background: var(--accent-gold);
      color: #07090e;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div id="cursor-follower"></div>

  <main class="app-shell">
    <header class="brand-hero">
      <div class="emblem-stage">
        <div class="emblem-disc" id="scroll-emblem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">

            <path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>

        </div>
      </div>

    <section class="deck-container" id="channel-deck"></section>

    <!-- Curator Sponsorship -->

  <!-- Support Modal -->
  <div class="overlay-backdrop" id="modal-container">

      <div class="modal-top">
        <h3 id="modal-heading">Support Desk</h3>
        <button class="btn-modal-close" id="btn-modal-close">✕</button>
      </div>
      <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 14px;">
        Submit a message or report directly to our edge gateway:
      </p>
      <input type="text" id="ticket-topic" class="editorial-input" placeholder="Topic (e.g. Broken Link, Invalidation)">
      <textarea id="ticket-details" class="editorial-input" rows="3" placeholder="Provide details or destination URL..."></textarea>

    </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const GATEWAY = "https://joinlinks-edge-gateway.prabhu-y1211.workers.dev";

    // Smooth Inertia Scroll Engine
    const lenis = new Lenis({
      duration: 1.1,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      touchMultiplier: 1.5
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Desktop Interactive Cursor
    const cursor = document.getElementById('cursor-follower');
    window.addEventListener('pointermove', (e) => {
      cursor.style.left = `${e.clientX}px`;
      cursor.style.top = `${e.clientY}px`;
    });

    // Scroll-Linked 3D Emblem Rotation
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const emblem = document.getElementById('scroll-emblem');
      if (emblem) {
        emblem.style.transform = `rotateY(${scrollY * 0.45}deg) rotateX(${scrollY * 0.15}deg)`;
      }
    });

    // Icons Mapping
    const SVG_ICONS = {
      shield: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
      news: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>`,
      archive: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>`,
      sparkle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
      copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`,
      arrowRight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`
    };

    let CHANNELS = [
      { slot: "c1", icon: "shield", name: "Official Root Network", badge: "Primary Hub", cat: "vip", members: "128k", link: "https://t.me/+hNw6_W8feAtkNmRl", featured: true },
      { slot: "c2", icon: "news", name: "Global Intelligence Feed", badge: "News Wire", cat: "news", members: "84k", link: "https://t.me/+ScPaYNrWjB03YTM1" },
      { slot: "c3", icon: "archive", name: "Curator Media Archive", badge: "Preserved Vault", cat: "archives", members: "95k", link: "https://t.me/+vg4oqSxq98o5MGM9" },
      { slot: "c4", icon: "sparkle", name: "Editorial Reels Index", badge: "Trending Media", cat: "trending", members: "112k", link: "https://t.me/+4kudDX0k4B8wNjZl" },
      { slot: "c5", icon: "sparkle", name: "Pulse Media Stream", badge: "Community", cat: "trending", members: "64k", link: "https://t.me/+TQ-Sj55nFEcwMGZl" },
      { slot: "c6", icon: "shield", name: "Vetted Publications", badge: "Curated", cat: "vip", members: "77k", link: "https://t.me/+ndnyWnLhQ_ExNTg1" },
      { slot: "c7", icon: "sparkle", name: "VIP Syndicate", badge: "Private Pass", cat: "vip", members: "53k", link: "https://t.me/+NynlcDlrCBFjNzNl" },
      { slot: "c8", icon: "archive", name: "Collective Digital Vault", badge: "Archive", cat: "archives", members: "68k", link: "https://t.me/+jYbJTa9ve0E2ODI9" },
      { slot: "c9", icon: "sparkle", name: "Prime Curator Spotlight", badge: "Curated Selection", cat: "trending", members: "49k", link: "https://t.me/+og-f0V4X9_E5MDdl" }
    ];

    let currentCategory = 'all';
    const container = document.getElementById('channel-deck');

    function renderCards() {
      container.innerHTML = '';
      const query = document.getElementById('directory-search').value.toLowerCase();

      const filtered = CHANNELS.filter(item => {
        const matchesCategory = (currentCategory === 'all' || item.cat === currentCategory);
        const matchesSearch = (!query || item.name.toLowerCase().includes(query) || item.badge.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });

      filtered.forEach((item) => {
        const card = document.createElement('article');
        card.className = `channel-card ${item.featured ? 'featured-pick' : ''}`;

        card.innerHTML = `
          <div class="card-main">
            <div class="card-symbol">${SVG_ICONS[item.icon] || SVG_ICONS.sparkle}</div>
            <div class="card-details">
              <h3>${item.name}</h3>
              <div class="card-metadata">
                <span class="editorial-badge">${item.badge}</span>
                <span class="meta-divider">•</span>
                <span>${item.members} Subscribers</span>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-action-copy" title="Copy Link" aria-label="Copy Link">${SVG_ICONS.copy}</button>
            <div class="btn-action-launch">
              <span>View</span>
              ${SVG_ICONS.arrowRight}
            </div>
          </div>
        `;

        // Magnetic Cursor Effects (Desktop)
        card.addEventListener('mouseenter', () => cursor.classList.add('cursor-hover'));
        card.addEventListener('mouseleave', () => cursor.classList.remove('cursor-hover'));

        // Copy Direct Link
        const copyBtn = card.querySelector('.btn-action-copy');
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(item.link);
          copyBtn.style.borderColor = "var(--accent-gold)";
          setTimeout(() => { copyBtn.style.borderColor = ""; }, 1200);
        });

        // Launch Link
        card.addEventListener('click', () => {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
          }

          let targetUrl = item.link;
          if (item.link_b && Math.random() < 0.5) targetUrl = item.link_b;

          const urlParams = new URLSearchParams(window.location.search);
          const src = urlParams.get('src') || (window.Telegram && window.Telegram.WebApp ? 'tma' : 'direct');
          fetch(`${GATEWAY}/api/click?slot=${item.slot}&src=${src}`, { method: 'POST', mode: 'no-cors' });

          const cleanInvite = targetUrl.replace('https://t.me/+', '');
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.openTelegramLink(targetUrl);
          } else {
            window.location.href = `tg://join?invite=${cleanInvite}`;
            setTimeout(() => { window.location.href = targetUrl; }, 400);
          }
        });

        container.appendChild(card);
      });

      // GSAP Stagger Reveal
      gsap.fromTo(".channel-card", 
        { opacity: 0, y: 16 }, 
        { opacity: 1, y: 0, duration: 0.45, stagger: 0.04, ease: "power2.out" }
      );
    }

    // Category Tabs Logic
    document.querySelectorAll('.editorial-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.editorial-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.getAttribute('data-category');
        renderCards();
      });
    });

    document.getElementById('directory-search').addEventListener('input', renderCards);

    // Modal Support
    const modal = document.getElementById('modal-container');
    const openModal = (title) => {
      document.getElementById('modal-heading').textContent = title;
      modal.style.display = 'flex';
    };

    document.getElementById('btn-dmca').addEventListener('click', () => openModal("Compliance Notice"));
    document.getElementById('btn-report').addEventListener('click', () => openModal("Report Inactive Link"));
    document.getElementById('btn-support').addEventListener('click', () => openModal("Curator Support"));
    document.getElementById('btn-modal-close').addEventListener('click', () => modal.style.display = 'none');

    document.getElementById('btn-submit-ticket').addEventListener('click', async () => {
      const topic = document.getElementById('ticket-topic').value;
      const details = document.getElementById('ticket-details').value;
      if (!topic && !details) return alert("Please provide details.");

      try {
        await fetch(`${GATEWAY}/notify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: `Curator Dispatch:\nTopic: ${topic}\nDetails: ${details}` })
        });
        alert("Dispatch delivered to Sentinel.");
        modal.style.display = 'none';
        document.getElementById('ticket-topic').value = '';
        document.getElementById('ticket-details').value = '';
      } catch (err) {
        alert("Dispatch logged.");
        modal.style.display = 'none';
      }
    });

    // Remote Schema Synchronization
    async function syncRemoteConfig() {
      try {
        const res = await fetch(`${GATEWAY}/api/config`);
        if (!res.ok) return;
        const config = await res.json();

        if (config.schema && Array.isArray(config.schema) && config.schema.length > 0) {
          CHANNELS = config.schema.map((item, idx) => ({
            ...item,
            icon: CHANNELS[idx] ? CHANNELS[idx].icon : "sparkle",
            cat: CHANNELS[idx] ? CHANNELS[idx].cat : "trending",
            members: CHANNELS[idx] ? CHANNELS[idx].members : "Verified"
          }));
          renderCards();
        }
      } catch (e) {
        console.warn("Using edge cache schema");
      }
    }

    renderCards();
    syncRemoteConfig();
  </script>
</body>
</html>
